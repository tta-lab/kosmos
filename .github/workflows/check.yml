name: NixOS Config Check

on:
  push:
    branches: [main, master, worker/**]
  pull_request:

jobs:
  flake-check:
    runs-on: ubuntu-latest
    container:
      image: docker://nixos/nix:latest
    steps:
      - uses: actions/checkout@v4
      - name: Nix flake check
        run: nix flake check
      - name: Statix lint
        run: statix check .
      - name: Full system build
        run: nix build .#nixosConfigurations.kosmos.config.system.build.toplevel --no-link
