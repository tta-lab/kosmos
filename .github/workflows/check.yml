name: NixOS Config Check

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v4
      - name: Nix syntax check
        run: nix-instantiate --parse configuration.nix
      - name: Flake evaluation check
        run: nix flake check --no-write-lock-file
      - name: Statix lint
        run: nix run nixpkgs#statix -- check .
