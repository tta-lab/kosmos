theme = "starlight"

[editor]
line-number = "relative"
cursorline = true
auto-save = true
bufferline = "multiple"
true-color = true
# Send clipboard writes as OSC 52 so Herdr can forward them through SSH to macOS.
clipboard-provider = "termcode"

[editor.cursor-shape]
insert = "bar"
normal = "block"
select = "underline"

[editor.statusline]
left = ["mode", "spinner", "file-name", "file-modification-indicator"]
right = ["diagnostics", "selections", "position", "file-encoding"]

[editor.lsp]
display-messages = true
display-inlay-hints = true

[editor.indent-guides]
render = true

# Copy selections and the current buffer path through OSC 52.
[keys.normal]
y = ["yank_main_selection_to_clipboard"]
Y = ':sh printf "\033]52;c;%%s\a" "$(printf "%%s" "%{buffer_name}" | base64 -w0)"'
# d = ["delete_selection"]
# p = ["paste_clipboard_after"]
# P = ["paste_clipboard_before"]
G = "goto_file_end"
esc = ["collapse_selection", "keep_primary_selection"]
ret = ["move_line_down", "goto_line_start"]
"A-/" = "@miw*<space>/<ret>"  # Alt-/ = match inner word → search → global search

[keys.normal.space]
q = ":quit"
G = [":new", ":insert-output lazygit", ":buffer-close!", ":redraw"]
e = [
  ':sh rm -f /tmp/unique-file',
  ':insert-output yazi "%{buffer_name}" --chooser-file=/tmp/unique-file',
  ':sh printf "\x1b[?1049h\x1b[?2004h" > /dev/tty',
  ':open %sh{cat /tmp/unique-file}',
  ':redraw',
]

[keys.select]
y = ["yank_main_selection_to_clipboard"]
d = ["delete_selection"]
p = ["paste_clipboard_after"]
P = ["paste_clipboard_before"]
