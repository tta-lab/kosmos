# Declarative DSH Web configuration. The Miniflux password remains outside this file.
- insert:
    - id: mcp-flicknote
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: flicknote
        transport: stdio
        command: flicknote
        args: [mcp]
        cwd: !!js process.cwd()

    - id: mcp-project
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: project
        transport: stdio
        command: project
        args: [mcp]
        cwd: !!js process.cwd()

    - id: mcp-miniflux
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: miniflux
        transport: stdio
        command: /home/neil/.local/bin/miniflux-mcp-wrapper
        cwd: !!js process.cwd()
        env:
          MINIFLUX_URL: "http://miniflux.localhost:17480"
          MINIFLUX_USERNAME: "admin"

- id: agent-default-model
  config:
    provider: deepseek-official
    model: deepseek-v4-flash-vision-exp

- id: llm-deepseek
  config:
    models:
      - id: deepseek-v4-flash
        name: DeepSeek-V4-Flash
        contextWindow: 1000000
      - id: deepseek-v4-pro
        name: DeepSeek-V4-Pro
        contextWindow: 1000000
      - id: deepseek-v4-flash-vision-exp
        name: DeepSeek-V4-Flash-Vision-Exp
        inputModalities: [text, image]
