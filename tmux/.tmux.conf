# Mouse support
set -g mouse on

# Vi copy mode
set -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"

# Open scrollback in editor
bind-key e capture-pane -S -3000 \; save-buffer /tmp/tmux-buffer.txt \; delete-buffer \; new-window "$EDITOR /tmp/tmux-buffer.txt"

# Start window/pane numbering at 1
set -g base-index 1
setw -g pane-base-index 1

# Increase scrollback
set -g history-limit 50000

# Reduce escape delay (better for vim/neovim)
set -sg escape-time 10

# True color support
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# UTF-8 locale (fixes wide-char selection / Chinese copy mojibake)
set-environment -g LANG en_US.UTF-8
set-environment -g LC_ALL en_US.UTF-8

# Fish
set-option -g default-shell /opt/homebrew/bin/fish

