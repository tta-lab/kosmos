mcp_port = 9783
allow_env = [
  "TTAL_*",
  "LENOS_*",
  "TMUX",
  "TMUX_*",
  "KUBECONFIG",
  "GOPATH",
  "GOBIN",
  "GOMODCACHE",
  "GOCACHE",
  "GOTOOLCHAIN",
  "GOTELEMETRY",
  "GOPROXY",
  "GOSUMDB",
  "GOPRIVATE",
  "GONOPROXY",
  "GONOSUMDB",
  "CGO_ENABLED",
  "CC",
  "CXX",
  "PKG_CONFIG_*",
  "CARGO_HOME",
  "CARGO_TARGET_DIR",
  "CARGO_BUILD_TARGET",
  "CARGO_TARGET_*",
  "RUSTUP_HOME",
  "RUSTUP_TOOLCHAIN",
  "RUSTC",
  "RUSTDOC",
  "RUSTFLAGS",
  "RUSTDOCFLAGS",
  "RUST_BACKTRACE",
  "RUST_LOG",
  "LIBCLANG_PATH",
  "BINDGEN_EXTRA_CLANG_ARGS",
  "EXA_API_KEY",
  "BRAVE_API_KEY",
  "HTTP_PROXY",
  "HTTPS_PROXY",
  "ALL_PROXY",
  "NO_PROXY",
  "http_proxy",
  "https_proxy",
  "all_proxy",
  "no_proxy"
]

allow_write = [
  "~/.einai",
  "~/.ttal",                             # ttal data dir (tasks, daemon state)
  "~/.task",                             # taskwarrior data (SQLite WAL needs write)
  "~/.config/ttal",                      # ttal config (projects.toml, config.toml, etc.)
  "~/.diary",                            # diary data
  "~/.local/share/flicknote",            # flicknote SQLite database
  "/private/var/folders",                # macOS TMPDIR — used by Go, Rust, and most build tools
  "/tmp",                                # Linux TMPDIR
  "~/go/pkg",                            # Go module cache, download cache, sumdb cache
  "~/Library/Caches/go-build",           # macOS: Go build cache
  "~/Library/Caches/golangci-lint",      # macOS: golangci-lint analysis cache
  "~/Library/Caches/cargo",              # macOS: Rust incremental build cache
  "~/.cache/go/build",                   # Linux: Go build cache
  "~/.cache/golangci-lint",              # Linux: golangci-lint analysis cache
  "~/.cache/cargo",                      # Linux: Rust incremental build cache
  "~/.cargo/registry",                   # Rust crate registry cache (index + crate downloads)
  "~/.cargo/git",                        # Rust git-sourced dependency cache (bare repos + checkouts)
  "~/.cargo/advisory-dbs",               # cargo-deny advisory DB cache (rustsec/advisory-db clone + lock)
  "~/.cache/organon",
  "~/.npm/_logs",                        # npm log directory
  "~/.claude",                           # claude agent config
  "~/.agents",                           # agent skills and config
]

allow_read = [
  "~/.mmx",
  "~/.config/diary",
  "~/.config/temenos",
  "~/.config/flicknote",                 # flicknote config
  "~/.config/git",                       # git config
  "~/.gitconfig",                        # git config (home dir variant)
  "~/.taskrc",                           # taskwarrior config
  "~/.taskrc.guion",                     # taskwarrior config
  "~/.taskrc.ttal",                      # taskwarrior config
  "~/.ttal/kubeconfig",                  # ttal Kubernetes config
  "~/.cargo/config.toml",                # Rust user-level Cargo config (registries, build overrides) — read-only by design
  "~/.rustup",                           # Rust toolchain
  "~/code/projects",                     # local project repos, read-only baseline for cross-repo context
  "~/code/references",                   # external reference repos, read-only baseline for research
  "/etc/static/ssl/certs",               # NixOS CA bundle target for /etc/ssl/certs symlinks
  "/Library/Developer/CommandLineTools", # macOS: xcrun shim resolves make/clang from here
]
