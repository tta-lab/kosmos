shell = "fish"

[flicknote]
  # "plan" and "fix" kept for backward compat with existing annotated tasks
  inline_projects = ["plan", "fix", "orientation"]

[sync]
  worker_agent_paths = ["/home/neil/Code/guion-opensource/ttal-cli/agents"]
  global_prompt_path = "/home/neil/Code/guion-opensource/ttal-cli/templates/ttal/CLAUDE.user.md"
  rules_paths = []
  skills_paths = [
    "~/Code/guion-opensource/ttal-cli/skills",
    "~/Code/guion-opensource/organon/skills",
    "~/Code/guion-opensource/einai/skills",
    "~/Code/guion-opensource/diary-cli/skills",
    "~/Code/guion/flicknote-cli/skills"
  ]

[voice]
  vocabulary = ["session", "claude", "codex", "worker", "tmux",
    "taskwarrior", "flicknote"]

[teams.default]
  chat_id = ""  # Get from @userinfobot on Telegram
  team_path = "/home/neil/Code/guion-opensource/ttal-cli/templates/ttal"
  data_dir = "~/.ttal"
  taskrc = "~/.taskrc"
  voice_language = "en"
  default_runtime = "lenos"
  emoji_reactions = false

[kubernetes]
  allowed_namespaces = ['supa-dev', 'apps-dev', 'apps-share']
